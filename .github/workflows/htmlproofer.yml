name: HTML Proofer

on:
  push:
  pull_request:

jobs:
  htmlproofer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true  # 自动处理 bundle install，更简洁
      
      - name: Build site
        run: bundle exec jekyll build
      
      - name: Run HTML Proofer
        run: |
          bundle exec htmlproofer _site \
            --ignore-missing true \
            --ignore_files "Dockerfile,init\.sh,docker-compose\.yml,\.env\.example,\.dockerignore,openclaw\.json\.example,README\.md" \
            --url_ignore "fonts\.googleapis\.com,fonts\.gstatic\.com"
