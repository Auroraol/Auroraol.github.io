name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: "pages-build-${{ github.ref }}"
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2.7

      - name: Install dependencies
        run: |
          gem install bundler
          bundle config unset without
          bundle install --jobs 4 --retry 3

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        # run: bundle exec jekyll build
        env:
          JEKYLL_ENV: "production"

      # 检测    
      # - name: Test site
      #   run: |
      #     bundle exec htmlproofer _site \
      #       --disable-external \
      #       --allow-missing-href \
      #       --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/,/^https:\/\//,/^\/posts\//,/^\/categories\//,/^\/tags\//,/^\/archives\//,/^\/about\//,/^\/tool\//,/^\/treehole\//"
      # - name: Upload site artifact
      #   uses: actions/upload-pages-artifact@v3
      #   with:
      #     path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: "pages-deploy-${{ github.ref }}"
      cancel-in-progress: true
    steps:
      - name: Wait for previous Pages deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Wait and retry if deployment fails due to in-progress deployment
            // GitHub Pages API doesn't expose deployment status easily, so we use a simple retry with delay
            console.log('Checking for previous deployments and waiting if needed...');
            
            // Simple wait: if there's a conflict, wait a bit and let concurrency handle it
            // The concurrency setting should prevent multiple workflows, but Pages deployment 
            // might still be in progress from a previous run
            console.log('Waiting 60 seconds to allow any previous deployments to complete...');
            await new Promise(resolve => setTimeout(resolve, 60000));
            
            console.log('Proceeding with deployment...');
      - name: Deploy to GitHub Pages (with retry)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
      - name: Retry deployment if failed
        if: failure() && steps.deployment.outcome == 'failure'
        run: |
          echo "First deployment attempt failed, waiting 60 seconds and retrying..."
          sleep 60
      - name: Deploy to GitHub Pages (retry)
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
